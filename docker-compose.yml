services:
  postgres:
    image: postgres:15-alpine
    container_name: travelhorizon-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelhorizon}
      POSTGRES_USER: ${POSTGRES_USER:-travelhorizon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - travelhorizon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  travelhorizon_postgres_data:
    name: travelhorizon_postgres_data
