<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="description" content="Admin sign-in for TravelHorizon." />
    <title>Admin sign-in — TravelHorizon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body data-page="admin" class="admin-page">
    <header class="admin-header">
      <a class="wordmark" href="index.html" aria-label="TravelHorizon home"
        ><span class="wordmark-mark">TH</span
        ><span>Travel<span class="wordmark-light">Horizon</span></span></a
      >
      <a class="admin-back" href="index.html">Back to website ↗</a>
    </header>
    <main class="admin-main admin-login-main">
      <section class="admin-intro">
        <p class="eyebrow dark-eyebrow">ADMIN ACCESS</p>
        <h1>Welcome back.</h1>
        <p>Sign in with your administrator account to edit site content.</p>
      </section>
      <form id="admin-login-form" class="admin-login-card">
        <label>
          Login name
          <input name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button class="button-link" type="submit">
          <span>Sign in</span><span aria-hidden="true">↗</span>
        </button>
        <p id="admin-login-status" class="admin-status" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
